<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAFFIC ENGINE V2 | audittraffichub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .audit-card { background: #111; border: 1px solid var(--panel-border); padding: 25px; margin: 20px 0; text-align: center; }
        .timer-display { font-size: 2.5rem; color: var(--matrix-green); margin: 15px 0; font-weight: bold; }
        #login-area { display: block; } 
        #action-area, #submit-area { display: none; }
        input[type="text"] { 
            padding: 12px; width: 80%; max-width: 300px; 
            background: #000; color: var(--matrix-green); 
            border: 1px solid var(--matrix-green); margin-bottom: 20px;
            text-align: center; font-family: monospace; font-size: 1.1rem;
        }
        /* Popup Styles */
        #submit-popup {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: #000; border: 2px solid var(--matrix-green);
            padding: 30px; z-index: 1000; text-align: center; box-shadow: 0 0 20px var(--matrix-green);
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1 class="matrix-title">TRAFFIC ENGINE V2</h1>
        <p id="user-display" style="color: #666; line-height: 1.5;">[ SYSTEM: STANDBY ]</p>
    </header>

    <div id="login-area" class="audit-card">
        <h3>IDENTITY VERIFICATION</h3>
        <p>ระบุ ID หรือชื่อเล่นเพื่อสะสมแต้ม</p>
        <input type="text" id="viewer-id" placeholder="Enter Your ID...">
        <br>
        <button class="audit-btn" onclick="saveIdentity()">ACCESS SYSTEM</button>
    </div>

    <div id="action-area">
        <div style="text-align:center; color:#888; margin-bottom:10px;">
            PROGRESS: <span id="current-step" style="color:var(--matrix-green)">0</span> / 3 SITES
        </div>
        <div class="audit-card">
            <h3 id="site-title">กำลังดึงข้อมูลคิว...</h3>
            <div id="timer" class="timer-display" style="display:none;">30</div>
            <button id="action-btn" class="audit-btn" onclick="startAudit()" disabled>LOADING...</button>
        </div>
    </div>

    <div id="submit-area" class="audit-card">
        <h2 style="color:var(--matrix-green)">[ ACCESS GRANTED ]</h2>
        <p>ระบบอนุญาตให้คุณอัปเดต URL ประจำตัวได้แล้ว</p>
        <br>
        <button class="audit-btn" onclick="openPopup()" style="background:var(--matrix-green); color:#000;">ฝากลิงก์เว็บของคุณ</button>
        <br><br>
        <button class="audit-btn" onclick="resetSession()" style="font-size:0.7rem; padding:5px 10px;">ทำรายการใหม่ (เปลี่ยนชื่อ)</button>
    </div>
</div>

<div id="overlay" class="overlay"></div>
<div id="submit-popup">
    <h3 style="color:var(--matrix-green)">UPDATE YOUR URL</h3>
    <p style="font-size: 0.8rem; color: #888;">ลิงก์นี้จะถูกนำไปสุ่มให้สมาชิกคนอื่นดู</p>
    <input type="text" id="new-url" placeholder="https://your-website.com" style="width: 100%; margin: 15px 0; background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px;">
    <br>
    <button class="audit-btn" onclick="submitNewUrl()">ยืนยันการบันทึก</button>
    <p id="status-msg" style="margin-top:10px; font-size:0.8rem;"></p>
    <button onclick="closePopup()" style="background:none; border:none; color:#555; cursor:pointer; margin-top:10px;">[ ปิดหน้าต่าง ]</button>
</div>

<script>
    let step = 0;
    let timerInterval;
    let memberSites = [];
    
    // URL สคริปต์ล่าสุดของพี่
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjfMIiIfxSN_HbPt7c-pMItUAOQuzclTpiSvA4i91aLJ1QRFUAfzsw77xAdJfAC7VF3Q/exec";

    window.onload = () => {
        const savedId = localStorage.getItem('auditor_id');
        if (savedId) { showActionArea(savedId); }
    };

    function saveIdentity() {
        const idInput = document.getElementById('viewer-id');
        const id = idInput.value.trim();
        if (id.length >= 3) {
            localStorage.setItem('auditor_id', id);
            showActionArea(id);
        } else { alert("ID ต้องมีความยาวอย่างน้อย 3 ตัวอักษร"); }
    }

    async function showUserStats(id) {
        try {
            const response = await fetch(`${SCRIPT_URL}?checkUser=${encodeURIComponent(id)}`);
            const stats = await response.json();
            if(stats) {
                document.getElementById('user-display').innerHTML = `
                    [ USER: ${id.toUpperCase()} ] <br>
                    <span style="color:var(--matrix-green); font-size:0.8rem; letter-spacing:1px;">
                        ช่วยเพื่อนแล้ว: ${stats.done} ครั้ง | เว็บคุณถูกดู: ${stats.received} ครั้ง
                    </span>
                `;
            }
        } catch (e) { console.log("Stats update delayed"); }
    }

    async function showActionArea(id) {
        document.getElementById('login-area').style.display = 'none';
        document.getElementById('action-area').style.display = 'block';
        showUserStats(id);
        try {
            const response = await fetch(SCRIPT_URL);
            memberSites = await response.json();
            if (memberSites && memberSites.length > 0) {
                document.getElementById('site-title').innerText = "พร้อมทำการ Audit";
                document.getElementById('action-btn').disabled = false;
                document.getElementById('action-btn').innerText = "เริ่มตรวจสอบ (SITE 1)";
            }
        } catch (e) { document.getElementById('site-title').innerText = "ERROR: ฐานข้อมูลขัดข้อง"; }
    }

    function startAudit() {
        if (step >= memberSites.length) return;
        const btn = document.getElementById('action-btn');
        const timerDiv = document.getElementById('timer');
        let timeLeft = 30;
        window.open(memberSites[step], '_blank');
        btn.disabled = true;
        btn.innerText = "กำลังตรวจสอบ...";
        timerDiv.style.display = 'block';
        timerDiv.innerText = timeLeft;
        timerInterval = setInterval(() => {
            timeLeft--;
            timerDiv.innerText = timeLeft;
            if (timeLeft <= 0) { clearInterval(timerInterval); completeStep(); }
        }, 1000);
    }

    // 🚩 ประกาศตัวแปรไว้นอกฟังก์ชัน (เอาไว้บนสุดของ <script> หรือก่อนฟังก์ชันนี้ก็ได้)
    let totalWatched = 0; 
    const UNLOCK_AT = 5;

    async function completeStep() {
        const viewerId = localStorage.getItem('auditor_id');
        const watchedUrl = memberSites[step];

        // 1. ส่งแต้มไปบันทึก (V5)
        fetch(`${SCRIPT_URL}?viewerId=${encodeURIComponent(viewerId)}&targetUrl=${encodeURIComponent(watchedUrl)}`, { mode: 'no-cors' });

        step++;          // ลำดับในคิวปัจจุบัน (0, 1, 2)
        totalWatched++;   // ยอดรวมสะสม (นับไปเรื่อยๆ ไม่รีเซ็ต)
        
        document.getElementById('current-step').innerText = totalWatched;
        
        const btn = document.getElementById('action-btn');
        const timerDiv = document.getElementById('timer');

        // 🚩 2. เช็คเงื่อนไขปลดล็อกปุ่มฝากลิงก์ (เมื่อดูครบ 5 เว็บ)
        if (totalWatched >= UNLOCK_AT) {
            document.getElementById('submit-area').style.display = 'block'; 
            // เปลี่ยนข้อความปุ่ม Access Granted ให้ดูเทพขึ้น
            const grantedH2 = document.getElementById('submit-area').querySelector('h2');
            if(grantedH2) grantedH2.innerText = "[ UNLIMITED ACCESS GRANTED ]";
        }

        // 🚩 3. ระบบวนลูปคิว (ถ้าดูจนหมด 3 ลิงก์ที่ดึงมา ให้ดึงใหม่ทันที)
        if (step >= memberSites.length) {
            btn.innerText = "กำลังดึงคิวใหม่...";
            btn.disabled = true;
            try {
                const response = await fetch(SCRIPT_URL);
                memberSites = await response.json();
                step = 0; // รีเซ็ตตัวนับคิวใหม่ แต่ totalWatched ไม่รีเซ็ต
            } catch (e) {
                console.log("Reload queue failed");
            }
        }

        // 4. รีเซ็ตปุ่มให้กดต่อได้ทันที (Looping)
        btn.disabled = false;
        btn.innerText = `ตรวจสอบเว็บต่อไป (ลำดับที่ ${totalWatched + 1})`;
        timerDiv.style.display = 'none';
        
        // อัปเดตแต้มโชว์ด้านบน
        showUserStats(viewerId); 
    }

    // --- Popup Functions ---
    function openPopup() {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('submit-popup').style.display = 'block';
    }
    function closePopup() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('submit-popup').style.display = 'none';
    }

    async function submitNewUrl() {
        const viewerId = localStorage.getItem('auditor_id');
        const urlValue = document.getElementById('new-url').value.trim();
        const msg = document.getElementById('status-msg');
        if (!urlValue.includes('http')) { alert("กรุณาใส่ URL ให้ถูกต้อง"); return; }
        msg.innerText = "กำลังบันทึกข้อมูล...";
        try {
            const finalUrl = `${SCRIPT_URL}?viewerId=${encodeURIComponent(viewerId)}&updateMyUrl=${encodeURIComponent(urlValue)}`;
            await fetch(finalUrl, { mode: 'no-cors' });
            msg.style.color = "var(--matrix-green)";
            msg.innerText = "บันทึกสำเร็จ! ลิงก์เข้าสู่คลังแล้ว";
            setTimeout(() => { location.reload(); }, 2000);
        } catch (e) { msg.innerText = "เกิดข้อผิดพลาด"; }
    }

    function resetSession() { localStorage.removeItem('auditor_id'); location.reload(); }
</script>
</body>
</html>
