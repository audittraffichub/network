<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAFFIC ENGINE V2 | audittraffichub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .audit-card { background: #111; border: 1px solid var(--panel-border); padding: 25px; margin: 20px 0; text-align: center; }
        .timer-display { font-size: 2.5rem; color: var(--matrix-green); margin: 15px 0; font-weight: bold; }
        #submit-area, #action-area { display: none; }
        input[type="text"] { 
            padding: 12px; width: 80%; max-width: 300px; 
            background: #000; color: var(--matrix-green); 
            border: 1px solid var(--matrix-green); margin-bottom: 20px;
            text-align: center; font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1 class="matrix-title">TRAFFIC ENGINE V2</h1>
        <p id="user-display" style="color: #666;">[ SYSTEM: STANDBY ]</p>
    </header>

    <div id="login-area" class="audit-card">
        <h3>IDENTITY VERIFICATION</h3>
        <p>ระบุ ID หรือชื่อเล่นเพื่อสะสมแต้ม (Done Points)</p>
        <input type="text" id="viewer-id" placeholder="Enter Your ID...">
        <br>
        <button class="audit-btn" onclick="saveIdentity()">ACCESS SYSTEM</button>
    </div>

    <div id="action-area">
        <div style="text-align:center; color:#888; margin-bottom:10px;">
            PROGRESS: <span id="current-step" style="color:var(--matrix-green)">0</span> / 3 SITES
        </div>
        <div class="audit-card">
            <h3 id="site-title">กำลังดึงข้อมูลคิว...</h3>
            <div id="timer" class="timer-display" style="display:none;">30</div>
            <button id="action-btn" class="audit-btn" onclick="startAudit()" disabled>LOADING...</button>
        </div>
    </div>

    <div id="submit-area" class="audit-card">
        <h2 style="color:var(--matrix-green)">[ ACCESS GRANTED ]</h2>
        <p>แต้มสะสมของคุณถูกบันทึกแล้ว คุณสามารถส่งลิงก์ได้ทันที</p>
        <br>
        <a href="https://tally.so/r/J9kgXK" target="_blank" class="audit-btn" style="background:var(--matrix-green); color:#000;">วางลิงก์โดเมนของคุณ</a>
        <br><br>
        <button class="audit-btn" onclick="location.reload()" style="font-size:0.7rem; padding:5px 10px;">ทำรายการใหม่</button>
    </div>
</div>

<script>
    let step = 0;
    let timerInterval;
    let memberSites = [];
    
    // 🔗 เปลี่ยนเป็น URL Google Script V3 ของพี่ (อันที่มี doPost)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyL4Zeb2PTuFk3UvWrPkAiNo5_hKhMHvhPvFrcuarAWorpOA6Jbir0RhOiM5BRnIc1PiA/exec";

    window.onload = () => {
        const savedId = localStorage.getItem('auditor_id');
        if (savedId) {
            showActionArea(savedId);
        }
    };

    function saveIdentity() {
        const id = document.getElementById('viewer-id').value.trim();
        if (id.length >= 3) {
            localStorage.setItem('auditor_id', id);
            showActionArea(id);
        } else {
            alert("ID ต้องมีความยาวอย่างน้อย 3 ตัวอักษร");
        }
    }

    async function showActionArea(id) {
        document.getElementById('login-area').style.display = 'none';
        document.getElementById('action-area').style.display = 'block';
        document.getElementById('user-display').innerText = `[ USER: ${id.toUpperCase()} ]`;
        
        // ดึงคิวจาก Sheets
        try {
            const response = await fetch(SCRIPT_URL);
            memberSites = await response.json();
            if (memberSites.length > 0) {
                document.getElementById('site-title').innerText = "พร้อมทำการ Audit";
                document.getElementById('action-btn').disabled = false;
                document.getElementById('action-btn').innerText = "เริ่มตรวจสอบ (SITE 1)";
            }
        } catch (e) {
            document.getElementById('site-title').innerText = "ERROR: ระบบฐานข้อมูลขัดข้อง";
        }
    }

    function startAudit() {
        const btn = document.getElementById('action-btn');
        const timerDiv = document.getElementById('timer');
        let timeLeft = 30;

        window.open(memberSites[step], '_blank');

        btn.disabled = true;
        btn.innerText = "กำลังวิเคราะห์โครงสร้างเว็บ...";
        timerDiv.style.display = 'block';

        timerInterval = setInterval(() => {
            timeLeft--;
            timerDiv.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                completeStep();
            }
        }, 1000);
    }

    async function completeStep() {
        const viewerId = localStorage.getItem('auditor_id');
        const watchedUrl = memberSites[step];

        // 🚀 ส่งแต้มไปบันทึก (Done + Received)
        // ใช้แบบ GET ส่ง Query Params เพื่อความง่ายในการรับค่าใน Apps Script
        fetch(`${SCRIPT_URL}?viewerId=${encodeURIComponent(viewerId)}&targetUrl=${encodeURIComponent(watchedUrl)}`, { 
            method: 'POST',
            mode: 'no-cors' 
        });

        step++;
        document.getElementById('current-step').innerText = step;
        const btn = document.getElementById('action-btn');
        const timerDiv = document.getElementById('timer');

        if (step < 3) {
            btn.disabled = false;
            btn.innerText = `เริ่มตรวจสอบ (SITE ${step + 1})`;
            timerDiv.style.display = 'none';
            document.getElementById('timer').innerText = "30";
        } else {
            document.getElementById('action-area').style.display = 'none';
            document.getElementById('submit-area').style.display = 'block';
        }
    }
</script>
</body>
</html>
